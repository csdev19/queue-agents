name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Wrangler
        run: bun add -g wrangler

      - name: Build packages only
        run: bun run build --filter='@queue-agents/*'

      - name: Build app
        working-directory: apps/fullstack-fn-and-convex
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          JWT_PRIVATE_JWK: ${{ secrets.JWT_PRIVATE_JWK }}
          JWT_KID: ${{ secrets.JWT_KID }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/fullstack-fn-and-convex
          secrets: |
            VITE_CONVEX_URL
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            DATABASE_URL
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            JWT_PRIVATE_JWK
            JWT_KID
        env:
          ENVIRONMENT: production
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          JWT_PRIVATE_JWK: ${{ secrets.JWT_PRIVATE_JWK }}
          JWT_KID: ${{ secrets.JWT_KID }}
